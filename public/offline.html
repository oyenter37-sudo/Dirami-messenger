<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071116" />
    <title>Нет сети · Dirami</title>
    <style>
      *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 80% 5%,#174b4a 0,transparent 38%),#071116;color:#ecfffb;font-family:system-ui,-apple-system,sans-serif;padding:24px}.card{width:min(100%,420px);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:32px;background:rgba(10,31,36,.88);box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}.logo{display:grid;place-items:center;width:66px;height:66px;margin:auto;border-radius:22px;background:#55d8bf;color:#08201f;font-size:29px;font-weight:900}h1{font-size:24px;margin:20px 0 8px}p{margin:0;color:rgba(236,255,251,.62);font-size:14px;line-height:1.6}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:999px;background:#55d8bf;color:#08201f;font-size:14px;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">D</div>
      <h1>Dirami ждёт подключения</h1>
      <p>Проверьте интернет и попробуйте снова. Установленное приложение откроется автоматически, когда сеть вернётся.</p>
      <button onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
